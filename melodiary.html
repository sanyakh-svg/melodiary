<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<title>MeloDiary — інтерактивний AI-прототип (Анімації)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b14;--surface:#191e37;--surface2:#252c50;--primary:#7189ff;--secondary:#c471ff;--text:#edf0ff;--muted:#b4c0f1;--soft:#aaadb7;--line:#bbc7ff;--success:#4bb536;--error:#cd566a;--radius:38px}
*{box-sizing:border-box}
html{background:#05060c}
body{margin:0;color:var(--text);font-family:"Istok Web",Arial,sans-serif;background:var(--bg);min-height:100vh;font-size:16px}
button,input,textarea{font:inherit}
button{cursor:pointer;transition:transform 0.1s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--secondary);outline-offset:3px}
button:active{transform:scale(.975)}
button:disabled{cursor:not-allowed;opacity:.5;transform:none}

.app{width:min(100%,440px);min-height:100dvh;margin:auto;position:relative;background:var(--bg);overflow-x:hidden;box-shadow:0 0 55px #0006}
.main{padding:20px 16px 112px;min-height:100dvh;}

/* 1. Directional Page Transitions */
@keyframes slideLeft {
    from { opacity: 0.3; transform: translateX(15px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes slideRight {
    from { opacity: 0.3; transform: translateX(-15px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes fade {
    from { opacity: 0.5; }
    to { opacity: 1; }
}

.main.forward { animation: slideLeft .25s ease both; }
.main.backward { animation: slideRight .25s ease both; }
.main.fade { animation: fade .22s ease both; }

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:700}h1{font-size:32px;line-height:1.23}h2{font-size:24px}h3{font-size:20px}
button{border:0}.brand{font:700 46px/1.12 Lexend,sans-serif;letter-spacing:-2.2px;margin:6px 0 14px}.brand span{color:var(--primary)}
.tabs{display:flex;border-bottom:1px solid var(--soft);gap:30px;margin:0 -7px 12px;padding:0 9px}
.tab{background:none;color:var(--text);font-size:20px;font-weight:700;padding:5px 0 2px;position:relative}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--secondary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:12px 0;position:relative}.review-card{padding:12px 12px 18px}
.byline{display:flex;align-items:center;gap:8px;min-height:52px}.avatar{height:52px;width:52px;object-fit:cover;border:1px solid var(--secondary);border-radius:50%;padding:3px;background:var(--bg);flex-shrink:0}.user-name{font-weight:700;font-size:20px;line-height:1.1}.handle{color:var(--muted);font-size:16px;line-height:1.15}.date{margin-left:auto;align-self:end;padding-bottom:3px;text-align:right;white-space:nowrap;font-size:15px}.dots{margin-left:auto;background:transparent;color:var(--text);font-weight:bold;font-size:25px;line-height:20px;padding:0 5px}.review-more{display:flex;align-items:center;justify-content:flex-end;height:17px;margin-top:-7px}
.album-row{display:flex;gap:12px;align-items:flex-start;margin-top:7px}.cover{height:160px;width:160px;object-fit:cover;border:1px solid var(--line);flex-shrink:0}.album-meta{flex:1;min-width:0}.album-name{font-size:24px;font-weight:bold;line-height:1.25;margin:2px 0}.artist{font-size:20px;color:var(--muted);font-weight:bold}.rating{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:16px}.stars{font-family:Arial,sans-serif;white-space:nowrap;letter-spacing:-1.7px;color:var(--text);font-size:25px}.excerpt-title{font-size:30px;font-weight:700;line-height:1.2;margin:15px 0 8px}.excerpt{line-height:1.45;font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;justify-content:space-between;gap:8px;margin-top:13px}.chip{background:transparent;border:2px solid #d5dbff;color:var(--text);border-radius:24px;padding:3px 13px;font-weight:700;font-size:17px}.chip.pink{border-color:#ebc0ff}.engage{border-top:1px solid var(--line);margin-top:14px;padding:14px 0 0;display:flex;align-items:center;gap:22px}.plain-icon{background:transparent;color:var(--text);padding:0;display:inline-flex;align-items:center;gap:8px;font-size:23px}.plain-icon svg,.navbtn svg{width:29px;height:29px;stroke:currentColor;stroke-width:1.6;fill:none}

/* 4. Like button interactions */
@keyframes heartBeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}
.plain-icon.liked svg { fill: currentColor; }
.plain-icon.liked { 
    color: var(--secondary); 
    animation: heartBeat 0.3s ease-in-out both; 
}
.share{margin-left:auto}

.nav{position:fixed;z-index:25;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),400px);height:76px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(12px)}
.navbtn{flex:1;background:none;color:var(--text);display:flex;align-items:center;flex-direction:column;gap:0;font-size:14px;padding:7px 0 3px;line-height:1.3}.navbtn.active svg{filter:drop-shadow(0 0 4px var(--secondary));color:#eac2ff}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{color:var(--text);background:none;padding:1px 2px;display:flex}.back svg{height:42px;width:56px;stroke-width:1.4;stroke:currentColor;fill:none}.searchfield{height:66px;border:4px solid var(--primary);border-radius:22px;display:flex;align-items:center;gap:12px;background:var(--surface);padding:0 12px;margin:3px 0 16px}.searchfield svg{height:28px;width:28px;flex:none;stroke:var(--text);fill:none;stroke-width:1.8}.searchfield input{width:100%;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-weight:bold;font-size:18px}.clear{font-size:33px;color:var(--text);background:none;line-height:1}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:12px 0 20px}.sectionhead span{color:var(--soft)}
.search-card{display:flex;align-items:center;gap:12px;padding:11px;margin:10px 0;border-radius:38px;width:100%;color:var(--text);text-align:left}.search-card .cover{width:96px;height:96px}.search-card .album-name{font-size:23px}.search-card .artist{font-size:16px;font-weight:400;margin:2px 0}.search-card small{color:var(--muted);font-size:16px}.search-card .rating-side{margin-left:auto;align-self:center;white-space:nowrap}.search-card .stars{font-size:21px}.open-card{cursor:pointer}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty svg{width:54px;height:54px;stroke:var(--primary);fill:none;margin-bottom:12px}.empty h3{color:var(--text);margin:10px 0}
.album-top{display:flex;align-items:center;justify-content:space-between}.album-head{display:flex;gap:12px;align-items:start}.album-head .cover{height:158px;width:158px}.album-head h1{font-family:Lexend,sans-serif;font-size:43px;line-height:1.1;letter-spacing:-1.4px}.album-head .artist{font-size:23px;color:var(--text);margin:6px 0}.album-head .rating{margin-top:9px}.genre-row{display:flex;gap:16px;justify-content:space-between;margin:20px 5px}.genre-row .chip{font-size:20px}.spaced{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.text-link{color:var(--secondary);background:none;font-weight:bold;font-size:18px}.mini-review{padding:12px 15px}.mini-review .byline{min-height:46px}.mini-review .avatar{width:46px;height:46px}.mini-review .excerpt-title{font-size:23px}.divider{height:1px;background:var(--line);margin:20px 0}.quickrate{display:flex;justify-content:space-between;align-items:center}.rate-button{background:none;color:var(--text);padding:0 2px;font-family:Arial,sans-serif;font-size:44px;line-height:1.2}.rate-button.selected{color:var(--primary)}.heart{color:var(--text);background:none;font-size:41px}.text-area{width:100%;min-height:136px;background:var(--surface);border:2px solid var(--line);border-radius:33px;padding:17px 21px;color:var(--text);resize:vertical;outline:none}.text-area::placeholder{color:var(--soft)}.primary{background:var(--primary);border-radius:35px;padding:13px 22px;color:#080c1a;font-weight:bold;font-size:20px;min-height:53px}.primary.full{width:100%}.outline{background:transparent;border:2px solid var(--line);border-radius:28px;padding:11px 22px;color:var(--text);font-weight:700;font-size:19px}.submit-row{display:flex;justify-content:flex-end;margin-top:22px}.formbox{border:2px solid var(--line);border-radius:32px;padding:12px 12px 10px;margin-top:22px}.formbox h2{font-size:23px}.form-album{display:flex;align-items:end;gap:9px;margin:22px 0 12px}.form-album .cover{width:160px;height:160px}.form-album .artist{font-size:16px;font-weight:400}.form-album .album-name{font-size:20px}.fieldlabel{display:block;font-size:20px;font-weight:bold;margin:12px 0}.required{color:var(--secondary)}.star-picker{display:flex;gap:2px}.star-picker button{font:46px Arial,sans-serif;padding:0;color:var(--text);background:none;line-height:1.1}.star-picker button.selected{color:var(--primary)}.hint{color:var(--soft);font-size:14px;margin-top:4px}.mood-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 26px}.mood{border:2px solid #ebc7ff;background:transparent;color:var(--text);border-radius:50px;padding:5px 8px;font-size:19px;font-weight:700}.mood.selected{background:var(--secondary);color:white}.form-actions{display:grid;gap:9px}.form-actions .outline{background:#2c365f}.error{color:#ff9cad;margin:9px 0;font-size:14px}
.profile-header{text-align:center}.profile-header h1{text-align:left}.profile-photo{width:120px;height:120px;object-fit:cover;border:1px solid var(--secondary);padding:5px;border-radius:100%;margin:17px auto 3px;display:block}.profile-name{font-size:23px;line-height:1.1;font-weight:700}.profile-header .handle{font-size:16px}.bio{margin-top:6px}.stats{display:flex;justify-content:space-around;align-items:center;margin:16px 0 12px}.stat{flex:1;text-align:center;line-height:1.15}.stat+.stat{border-left:2px solid var(--line)}.stat strong{display:block;font-size:21px}.stat span{font-size:15px;color:var(--muted)}.edit-btn{width:82%;margin:0 auto 25px;display:block}.profile-tabs{display:flex;border-bottom:2px solid var(--line)}.profile-tabs button{flex:1;background:none;color:var(--text);font-weight:bold;font-size:19px}.profile-tabs button.active{color:var(--secondary);border-bottom:2px solid var(--secondary)}.profile-card .cover{width:155px;height:155px}.profile-card .excerpt-title{font-size:26px}.profile-card .rating{margin:20px 0 0}
.calendar-head{display:flex;justify-content:space-between;text-align:center;align-items:center;margin:20px 0}.calendar-head button{background:none;color:var(--text);font-size:29px}.entry-date{font-size:20px;font-weight:bold;margin:20px 4px 5px}.diary-card{width:100%;text-align:left;color:var(--text);padding:10px}.diary-card .cover{width:95px;height:95px}.diary-card .album-name{font-size:23px}.diary-card .excerpt-title{font-size:23px;margin:5px 8px}.diary-card .stars{font-size:26px}.diary-add{width:100%;margin:22px 0 10px}

/* 2. Modal animation */
@keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.overlay{position:fixed;inset:0;background:#000b;z-index:50;display:flex;justify-content:center;align-items:center;padding:18px;}
.dialog{width:min(100%,390px);background:var(--surface);border:2px solid var(--line);border-radius:27px;padding:23px;text-align:center;box-shadow:0 24px 55px #0008; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;}
.dialog h2{margin:8px 0}.dialog p{margin:12px 0 20px;color:var(--muted)}.dialog .form-actions{margin-top:10px}.danger{background:var(--error);color:white}

/* 3. Toast animation */
@keyframes slideUp {
    from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
}
.toast{position:fixed;z-index:60;bottom:100px;left:50%;width:max-content;max-width:90%;background:#303c66;border:1px solid var(--line);padding:10px 16px;border-radius:24px;box-shadow:0 6px 20px #0008; animation: slideUp 0.3s ease forwards;}

.menu{position:absolute;right:12px;top:37px;background:#2c365b;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:10;box-shadow:0 10px 25px #0009}.menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);padding:11px 20px;border-radius:9px}.menu button:hover{background:#3b476f}.menu .delete{color:#ffacb8}

/* 5. Star rating scale down on :active */
.star-picker button:active, .rate-button:active {
    transform: scale(0.8);
    transition: transform 0.1s;
}

@media(min-width:650px){body{padding:24px 0}.app{border:1px solid #3a426d;border-radius:30px;min-height:910px}.nav{bottom:25px}}
</style>

function loadReviews(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(Array.isArray(x))return x;}catch(e){}return SEED.map(r=>({...r}))}

let reviews=loadReviews(),screen="home",backStack=[],query="",selectedAlbum="starboy",rating=0,reviewText="",reviewTitle="",mood="Ностальгія",deleteId=null,menuId=null,profileTab="reviews",homeTab="forYou",quickText="",quickRating=0,toastText="",toastTimer=null,errorText="";
let transitionDir = "fade";

function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(reviews))}catch(e){showToast("Не вдалося зберегти дані браузера")}}
function album(id){return ALBUMS.find(a=>a.id===id)||ALBUMS[0]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stars(n){return `<span class="stars" aria-label="Оцінка ${n} з 5">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`}
function dateFmt(iso){return new Intl.DateTimeFormat("uk-UA",{day:"numeric",month:"long",year:"numeric"}).format(new Date(iso))}

};function ico(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`}

// 1. Navigation updates to include transition direction
function go(to,data){if(to===screen&&data===undefined)return;backStack.push(screen);screen=to;if(data?.album)selectedAlbum=data.album;menuId=null;errorText="";transitionDir="forward";render();window.scrollTo(0,0)}
function back(){screen=backStack.pop()||"home";menuId=null;errorText="";transitionDir="backward";render();window.scrollTo(0,0)}
function tab(to){screen=to;backStack=[];menuId=null;errorText="";transitionDir="fade";render();window.scrollTo(0,0)}

function showToast(t){toastText=t;renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastText="";renderToast()},3000)}
function renderToast(){let el=$("toast");if(toastText){if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.append(el)}el.textContent=toastText}else if(el)el.remove()}

// 4. toggleLike implementation
function toggleLike(btn) {
    btn.classList.toggle('liked');
    if (btn.classList.contains('liked')) {
        showToast('Вподобання додано');
    } else {
        showToast('Вподобання видалено');
    }
}

function nav(){return `<nav class="nav" aria-label="Основна навігація">${[["home","Головна"],["search","Пошук"],["diary","Щоденник"],["profile","Профіль"]].map(([id,label])=>`<button class="navbtn ${screen===id?"active":""}" onclick="tab('${id}')" aria-label="${label}" aria-current="${screen===id?"page":"false"}">${ico(id)}<span>${label}</span></button>`).join("")}</nav>`}
function header(title){return `<div class="topline"><button class="back" onclick="back()" aria-label="Назад">${ico("back")}</button><h1>${title}</h1></div>`}
function reviewer(){return `<img class="avatar" alt="Фото профілю Поліни" src="${IMG.avatar}"><div><div class="user-name">Поліна</div><div class="handle">@poli.mus</div></div>`}
function reviewCard(r,context="home"){let a=album(r.album);let compact=context==="profile";return `<article class="card review-card ${compact?"profile-card":""}">
<div class="byline">${reviewer()}<span class="date">${dateFmt(r.date)}</span></div>
<div class="review-more"><button class="dots" aria-label="Дії з відгуком" aria-expanded="${menuId===r.id}" onclick="toggleMenu('${r.id}')">•••</button></div>
${menuId===r.id?`<div class="menu"><button onclick="openReview('${r.id}')">Переглянути</button><button class="delete" onclick="askDelete('${r.id}')">Видалити відгук</button></div>`:""}
<div class="album-row open-card" role="button" tabindex="0" onclick="go('album',{album:'${a.id}'})" onkeydown="if(event.key==='Enter')go('album',{album:'${a.id}'})"><img class="cover" alt="Обкладинка альбому ${esc(a.title)}" src="${a.image}"><div class="album-meta"><div class="album-name">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="rating" style="margin-top:${compact?"25":"65"}px">${stars(r.rating)}<span>${r.rating} / 5</span></div></div></div>
<div class="excerpt-title">${esc(r.title||"Мій відгук")}</div>
${compact?`<p class="excerpt">${esc(r.text)}</p>`:`<p class="excerpt">${esc(r.text)}</p><div class="chips"><span class="chip">Інді</span><span class="chip pink">${esc(r.mood||"Ностальгія")}</span></div><div class="engage"><button class="plain-icon" onclick="toggleLike(this)">${ico("heart")} ${r.likes||0}</button><button class="plain-icon" onclick="showToast('Коментарі в демонстраційній версії')">${ico("message")} 3</button><button class="plain-icon share" onclick="shareReview('${r.id}')">${ico("share")}</button></div>`}</article>`}
function home(){return `<div class="brand">Melo<span>Diary</span></div><div class="tabs"><button class="tab ${homeTab==="forYou"?"active":""}" onclick="homeTab='forYou';transitionDir='fade';render()">Для тебе</button><button class="tab ${homeTab==="following"?"active":""}" onclick="homeTab='following';transitionDir='fade';render()">Підписки</button></div>${homeTab==="following"?`<div class="empty"><h3>Тут поки немає дописів</h3><p>Нові відгуки від підписок з’являться тут.</p><button class="outline" style="margin-top:20px" onclick="homeTab='forYou';transitionDir='fade';render()">Для тебе</button></div>`:reviews.length?reviews.slice().reverse().map(r=>reviewCard(r)).join(""):`<div class="empty"><h3>Поки немає відгуків</h3><p>Знайди альбом і поділись враженнями!</p><button class="primary" style="margin-top:18px" onclick="tab('search')">Знайти альбом</button></div>`}`}
function searchPage(){let q=query.trim().toLocaleLowerCase("uk");let found=ALBUMS.filter(a=>[a.title,a.artist,a.year].some(t=>t.toLocaleLowerCase("uk").includes(q)));return `<h1>Пошук</h1><div class="searchfield">${ico("search")}<input id="searchInput" aria-label="Пошук альбому" placeholder="Назва альбому або виконавець" value="${esc(query)}" oninput="searchChange(this.value)"><button class="clear" aria-label="Очистити пошук" onclick="query='';transitionDir='';render();$('searchInput').focus()">×</button></div><div class="sectionhead"><h3>Альбоми</h3><span>Знайдено: ${found.length}</span></div>${found.length?found.map(a=>`<button class="card search-card" onclick="go('album',{album:'${a.id}'})"><img class="cover" alt="Обкладинка ${esc(a.title)}" src="${a.image}"><div class="album-meta"><div class="album-name">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><small>Альбом · ${a.year}</small></div><div class="rating-side">${stars(Math.round(Number(a.rating)))}<div style="color:var(--muted);font-size:14px">${a.rating} / 5</div></div></button>`).join(""):`<div class="empty">${ico("empty")}<h3>Нічого не знайдено</h3><p>Спробуй іншу назву альбому або виконавця.</p><button class="outline" style="margin-top:18px" onclick="query='';transitionDir='';render();$('searchInput').focus()">Очистити пошук</button></div>`}`}
function searchChange(v){query=v;const inp=$("searchInput");const p=inp.selectionStart;transitionDir="";render();const next=$("searchInput");next.focus();next.setSelectionRange(p,p)}
function albumPage(){let a=album(selectedAlbum);let related=reviews.filter(r=>r.album===a.id);return `${header("Альбом")}<div class="album-head"><div style="flex:1;min-width:0"><h1>${esc(a.title)}</h1><div class="artist">${esc(a.artist)}</div><div style="font-size:15px;margin:12px 0 4px">Реліз: ${a.date}</div><div style="font-size:15px">Середній рейтинг:</div><div class="rating">${stars(Math.round(+a.rating))}<span>${a.rating}</span></div></div><img class="cover" src="${a.image}" alt="Обкладинка ${esc(a.title)}"></div><div class="genre-row">${a.genre.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><div class="spaced"><h2>Відгуки</h2><button class="text-link" onclick="go('albumReviews')">Усі</button></div>${related.length?related.slice(-1).map(r=>`<div class="card mini-review open-card" onclick="openReview('${r.id}')"><div class="byline">${reviewer()}<span style="margin-left:auto">${stars(r.rating)}</span></div><div class="excerpt-title">${esc(r.title)}</div></div>`).join(""):`<div class="card" style="text-align:center;color:var(--muted)">Відгуків ще немає — будь першою!</div>`}<div class="divider"></div><div class="quickrate"><div>${[1,2,3,4,5].map(i=>`<button class="rate-button ${quickRating>=i?"selected":""}" onclick="quickRating=${i};transitionDir='';render()" aria-label="${i} зірок">${quickRating>=i?"★":"☆"}</button>`).join("")}</div><button class="heart" aria-label="Зберегти альбом" onclick="showToast('Альбом додано до збереженого')">♡</button></div><textarea id="quickText" class="text-area" maxlength="1000" placeholder="Введіть текст..." oninput="quickText=this.value">${esc(quickText)}</textarea><div class="submit-row"><button class="primary" onclick="startReview()">Опублікувати</button></div>`}
function startReview(){rating=quickRating||0;reviewText=quickText;reviewTitle="";mood="Ностальгія";go("writeReview")}
function allReviews(){let r=reviews.filter(x=>x.album===selectedAlbum).slice().reverse();return `${header("Відгуки")}<h2 style="margin-bottom:18px">${esc(album(selectedAlbum).title)}</h2>${r.length?r.map(x=>reviewCard(x,"profile")).join(""):`<div class="empty"><h3>Відгуків ще немає</h3></div>`}<button class="primary full" onclick="startReview()">Написати відгук</button>`}
function writeReview(){const a=album(selectedAlbum);return `<div class="formbox">${header("Написати відгук")}<div class="form-album"><img class="cover" src="${a.image}" alt="Обкладинка ${esc(a.title)}"><div><div class="album-name">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div></div></div><div class="divider" style="margin:12px 28px 8px 0"></div><div class="fieldlabel">Ваша оцінка <span class="required">*</span></div><div class="star-picker">${[1,2,3,4,5].map(i=>`<button class="${rating>=i?"selected":""}" onclick="rating=${i};transitionDir='';render()" aria-label="Оцінити на ${i} з 5">${rating>=i?"★":"☆"}</button>`).join("")}</div><label for="reviewTitle" class="fieldlabel">Заголовок відгуку</label><input id="reviewTitle" class="text-area" style="min-height:51px;height:51px;border-radius:18px;padding:11px 16px" placeholder="Наприклад: Музика для душі" maxlength="80" value="${esc(reviewTitle)}" oninput="reviewTitle=this.value"><label for="reviewBody" class="fieldlabel">Ваш відгук <span class="required">*</span></label><textarea id="reviewBody" class="text-area" maxlength="1000" placeholder="Введіть текст..." oninput="reviewText=this.value;updateCount()">${esc(reviewText)}</textarea><div class="hint" id="textCount">${reviewText.length} / 1000 символів</div><div class="fieldlabel">Настрій <span style="color:var(--soft);font-weight:400">(необов’язково)</span></div><div class="mood-wrap">${["Ностальгія","Спокійний","Натхнення","Енергійний"].map(t=>`<button class="mood ${mood===t?"selected":""}" onclick="mood='${t}';transitionDir='';render()">${t}</button>`).join("")}</div>${errorText?`<p class="error" role="alert">${esc(errorText)}</p>`:""}<div class="form-actions"><button class="primary full" onclick="publish()">Опублікувати</button><button class="outline" onclick="cancelReview()">Скасувати</button></div></div>`}
function updateCount(){const e=$("textCount");if(e)e.textContent=reviewText.length+" / 1000 символів"}
function cancelReview(){rating=0;reviewText="";reviewTitle="";quickRating=0;quickText="";back()}
function publish(){if(rating<1){errorText="Оберіть оцінку від 1 до 5 зірок.";transitionDir='';render();return}if(!reviewText.trim()){errorText="Напишіть текст відгуку перед публікацією.";transitionDir='';render();return}const id="review-"+Date.now()+"-"+Math.floor(Math.random()*999);reviews.push({id,album:selectedAlbum,rating,title:reviewTitle.trim()||"Мій відгук",text:reviewText.trim(),mood,date:new Date().toISOString(),likes:0});persist();quickText="";quickRating=0;rating=0;reviewText="";reviewTitle="";screen="profile";profileTab="reviews";backStack=[];transitionDir="forward";render();window.scrollTo(0,0);showToast("✓ Відгук успішно опубліковано!")}
function profile(){let list=reviews.slice().reverse();return `<div class="profile-header"><h1>Профіль</h1><img src="${IMG.avatar}" alt="Фото профілю" class="profile-photo"><div class="profile-name">Поліна</div><div class="handle">@poli.mus</div><p class="bio">Зберігаю спогади в музиці</p><div class="stats"><div class="stat"><strong>${reviews.length+21}</strong><span>Відгуки</span></div><div class="stat"><strong>160</strong><span>Підписники</span></div><div class="stat"><strong>234</strong><span>Підписки</span></div></div><button class="outline edit-btn" onclick="showToast('Редагування профілю недоступне в демоверсії')">Редагувати профіль</button></div><div class="profile-tabs"><button class="${profileTab==="reviews"?"active":""}" onclick="profileTab='reviews';transitionDir='fade';render()">Відгуки</button><button class="${profileTab==="saved"?"active":""}" onclick="profileTab='saved';transitionDir='fade';render()">Збережене</button></div>${profileTab==="saved"?`<div class="empty"><h3>Поки нічого не збережено</h3><p>Збережені альбоми відображатимуться тут.</p></div>`:list.length?list.map(r=>reviewCard(r,"profile")).join(""):`<div class="empty"><h3>Твоїх відгуків поки немає</h3><p>Знайди улюблений альбом та напиши перший відгук.</p><button class="primary" style="margin-top:18px" onclick="tab('search')">Шукати альбом</button></div>`}`}
function diary(){let list=reviews.slice().reverse();return `${header("Щоденник")}<button class="primary diary-add" onclick="tab('search')">＋ Додати запис</button><div class="calendar-head"><button onclick="showToast('Відображено записи за доступний період')">‹</button><div><h3>Листопад 2026</h3><div style="font-size:14px">${list.length} записи за весь період</div></div><button onclick="showToast('Відображено записи за доступний період')">›</button></div>${list.length?list.map(r=>{let a=album(r.album);return `<div class="entry-date">${dateFmt(r.date)}</div><button class="card diary-card" onclick="openReview('${r.id}')"><div class="album-row"><img class="cover" src="${a.image}" alt="Обкладинка ${esc(a.title)}"><div><div class="album-name">${esc(a.title)}</div><div class="handle">${esc(a.artist)}</div>${stars(r.rating)}</div></div><div class="excerpt-title">${esc(r.title)}</div></button>`}).join(""):`<div class="empty"><h3>Щоденник порожній</h3><p>Нові відгуки з’являтимуться тут.</p></div>`}`}
let openedReview=null;
function openReview(id){openedReview=id;go("reviewDetail")}
function reviewDetail(){let r=reviews.find(x=>x.id===openedReview);if(!r)return `${header("Відгук")}<div class="empty"><h3>Відгук видалено</h3></div>`;let a=album(r.album);return `${header("Відгук")}<div class="card"><div class="byline">${reviewer()}<span class="date">${dateFmt(r.date)}</span></div><div class="album-row" style="margin-top:20px"><img class="cover" src="${a.image}" alt="${esc(a.title)}"><div><div class="album-name">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div style="margin-top:20px">${stars(r.rating)}</div></div></div><h2 style="margin:20px 0 10px">${esc(r.title)}</h2><p style="line-height:1.55;white-space:pre-wrap">${esc(r.text)}</p><div class="chips"><span class="chip pink">${esc(r.mood)}</span></div></div><button class="outline full" style="width:100%;color:#ffabb6" onclick="askDelete('${r.id}')">Видалити відгук</button>`}
function toggleMenu(id){menuId=menuId===id?null:id;transitionDir='';render()}
function askDelete(id){deleteId=id;menuId=null;renderModal()}
function renderModal(){let e=$("modal");if(!deleteId){if(e)e.remove();return}if(!e){e=document.createElement("div");e.id="modal";document.body.append(e)}e.className="overlay";e.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="deleteHeading" aria-describedby="deleteDescription"><h2 id="deleteHeading">Видалити відгук?</h2><p id="deleteDescription">Цю дію неможливо скасувати. Відгук зникне з профілю та щоденника.</p><div class="form-actions"><button class="primary danger" onclick="confirmDelete()">Так, видалити</button><button class="outline" id="cancelDelete" onclick="cancelDelete()">Скасувати</button></div></div>`;$("cancelDelete").focus()}
function cancelDelete(){deleteId=null;renderModal();showToast("Видалення скасовано")}
function confirmDelete(){reviews=reviews.filter(r=>r.id!==deleteId);persist();deleteId=null;screen="profile";profileTab="reviews";backStack=[];transitionDir="forward";render();window.scrollTo(0,0);showToast("Відгук видалено")}
function shareReview(id){let r=reviews.find(x=>x.id===id);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(`MeloDiary — ${album(r.album).title}: ${r.title}`).then(()=>showToast("Текст скопійовано")).catch(()=>showToast("Не вдалося скопіювати"))}else showToast("Поділитися відгуком")}

// 1. apply transition class
function render(){
    const views={home,search:searchPage,album:albumPage,writeReview,profile,diary,albumReviews:allReviews,reviewDetail};
    $("app").innerHTML=`<main class="main ${transitionDir}">${(views[screen]||home)()}</main>${nav()}`;
    renderModal();
    renderToast();
}
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&deleteId)cancelDelete()});
render();
</script>
</body>
</html>
